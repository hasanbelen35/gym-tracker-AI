<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Arka plan gradyanı -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <!-- Dambıl / Güç Turuncu Gradyanı -->
    <linearGradient id="dumbbellGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Yapay Zeka Işıltı Efekti (Kehribar/Sarı Tonu) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arka Plan Yuvarlatılmış Kart -->
  <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#bgGradient)" stroke="#27272a" stroke-width="4" />

  <!-- Arka Plan Yapay Zeka / Veri Ağ Çizgileri -->
  <g opacity="0.15">
    <line x1="100" y1="250" x2="400" y2="250" stroke="#f97316" stroke-width="2" stroke-dasharray="8 8" />
    <circle cx="150" cy="250" r="4" fill="#fbbf24" />
    <circle cx="250" cy="250" r="4" fill="#f97316" />
    <circle cx="350" cy="250" r="4" fill="#fbbf24" />
  </g>

  <!-- Yapay Zeka Beyin / Neural Noktaları (Üst Kısım) -->
  <g filter="url(#glow)" opacity="0.9">
    <circle cx="250" cy="140" r="8" fill="#fbbf24" />
    <path d="M 210 170 L 250 140 L 290 170" stroke="#f97316" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- Ana Dambıl İkonu -->
  <g transform="translate(0, 15)">
    <!-- Sol Ağırlık Plakaları -->
    <rect x="110" y="170" width="30" height="130" rx="10" fill="url(#dumbbellGrad)" />
    <rect x="150" y="190" width="25" height="90" rx="8" fill="#ea580c" opacity="0.8" />

    <!-- Orta Bar (Tutacak) -->
    <rect x="175" y="225" width="150" height="30" rx="4" fill="#27272a" stroke="#52525b" stroke-width="2" />
    <!-- Bar Üzerindeki Çizgiler (Tutuş Efekti) -->
    <line x1="210" y1="225" x2="210" y2="255" stroke="#71717a" stroke-width="3" />
    <line x1="250" y1="225" x2="250" y2="255" stroke="#71717a" stroke-width="3" />
    <line x1="290" y1="225" x2="290" y2="255" stroke="#71717a" stroke-width="3" />

    <!-- Sağ Ağırlık Plakaları -->
    <rect x="325" y="190" width="25" height="90" rx="8" fill="#ea580c" opacity="0.8" />
    <rect x="360" y="170" width="30" height="130" rx="10" fill="url(#dumbbellGrad)" />
  </g>

  <!-- Yapay Zeka Nabız / Çizgi Grafiği (Dambılın Altında) -->
  <path d="M 160 360 L 210 360 L 235 330 L 265 390 L 290 360 L 340 360" 
        stroke="#fbbf24" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Parlak AI Düğümleri -->
  <circle cx="235" cy="330" r="5" fill="#f97316" filter="url(#glow)" />
  <circle cx="265" cy="390" r="5" fill="#f97316" filter="url(#glow)" />

</svg>
