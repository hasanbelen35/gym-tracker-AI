services:
  # 1. MySQL db
  mysql-db:
    image: mysql:8.0
    container_name: gym_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gym-network

  # 2. Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gym_backend
    restart: always
    ports:
      - "${BACKEND_PORT}:5000"
    environment:
      PORT: 5000
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql-db:3306/${MYSQL_DATABASE}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - mysql-db
    networks:
      - gym-network

  # 3. Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gym_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT}:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - gym-network

volumes:
  mysql_data:

networks:
  gym-network:
    driver: bridge